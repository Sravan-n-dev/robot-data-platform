services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rdp
      POSTGRES_PASSWORD: rdp
      POSTGRES_DB: rdp
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rdp"]
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://rdp:rdp@db:5432/rdp
      DATA_DIR: /data
      INGEST_ROOT: /bags
    volumes:
      - ./bags:/bags
      - parquet:/data
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}

  prometheus:
    image: prom/prometheus:latest
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [api]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
  parquet:
